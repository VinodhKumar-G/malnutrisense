# docker-compose.yml — MalnutriSense multi-service deployment
version: '3.8'
 
services:
  api:
    build: .
    ports:
      - '8000:8000'
    environment:
      - MALNUTRISENSE_API_KEY=your-production-key-here
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 5s
      retries: 3
 
  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - '8501:8501'
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_URL=http://api:8000
